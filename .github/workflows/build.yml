name: Compilar mod

on:
  push:
  workflow_dispatch:

concurrency:
  group: prehistoric-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - name: Compilar
        run: gradle build --no-daemon
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-survival-jar
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Empaquetar proyecto completo
        run: |
          mkdir -p build/distribution
          git archive --format=zip --prefix=prehistoric-survival-0.3.0/ HEAD -o build/distribution/prehistoric-survival-0.3.0-project.zip
      - name: Subir proyecto completo
        uses: actions/upload-artifact@v4
        with:
          name: prehistoric-survival-0.3.0-project
          path: build/distribution/prehistoric-survival-0.3.0-project.zip
          if-no-files-found: error
